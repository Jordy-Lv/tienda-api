services:
  postgres:
    image: postgres:16-alpine
    container_name: tienda-postgres
    environment:
      POSTGRES_DB: tienda_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - tienda_postgres_data:/var/lib/postgresql/data

volumes:
  tienda_postgres_data:
